name: Generate Database Schema Docs

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * 1'        # Every Monday at 2 AM UTC
  workflow_dispatch:             # Manual trigger from GitHub UI

jobs:
  generate-schema:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Java + Graphviz
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jre graphviz

      # 3. Make script executable
      - name: Make script executable
        run: chmod +x ./generate_schema.sh

      # 4. Run SchemaSpy
      - name: Generate schema documentation
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: ./generate_schema.sh

      # 5. Keep only the last 7 reports
      - name: Cleanup old reports
        run: |
          cd generated
          # Keep only the 7 most recent timestamped directories
          ls -dt */ 2>/dev/null | grep -v latest | tail -n +8 | xargs -r rm -rf
          cd ..

      # 6. Commit & push
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --staged --quiet || git commit -m "docs: update schema documentation [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
